id = nekpo
name = Nekpo
tagline = The Neko Repo multi-tool
summary = A tool to manage packages and build them, works on the store and on any git based repo that uses this system
author = Akiko NekoMimi
license = Nekocense
source = https://github.com/NekoMimiOfficial/nekpo
category = Development
tags = tools, package manager, build system
accent = neko
icon = assets/icon.png
banner = assets/banner.png
changelog = changelog.md
version = auto
description = """
# Nekpo
Neko's repo tools, with this amazing tool the sky is the limit when it comes to using Neko's projects
You can build, install, init apps or manage build systems and dependencies plus run a CI tool for Neko Store staff
For the general public the main use of this would be to build C++ apps or install them from git repos or contributing to any Neko app that is hosted on the Neko Store or requires the NekoEco SDK that allows access to the Ecosystem utilities
"""

[artifact]
file = nekpo_*.tar.gz
kind = tarball
platform = linux
arch = x86_64

[artifact]
file = *.deb
kind = deb
platform = linux
arch = x86_64
